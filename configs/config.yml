# =============================================================================
# MEPhI SFU Server — Configuration File
# Медиасервер SFU на основе WebRTC
# =============================================================================

# --- HTTP / WebSocket сервер ---
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  max_conns: 0

# SFU медиа-ядро
sfu:
  max_rooms: 0
  max_peers_per_room: 0
  pli_interval: 2s
  sender_buf_size: 100

# ICE / WebRTC NAT
ice:
  stun_servers: []

  # TURN-серверы для клиентов за symmetric NAT
  turn_servers: []
  # Пример:
  # turn_servers:
  #   - urls:
  #       - "turn:turn.example.com:3478?transport=udp"
  #       - "turn:turn.example.com:3478?transport=tcp"
  #     username: "sfuuser"
  #     credential: "sfupassword"

# Кластеризация через Redis
cluster:
  # false = standalone-нода
  # true  = нода синхронизирует состояние через Redis
  enabled: false
  redis_addr: "localhost:6379"
  redis_password: qwerty123
  redis_db: 0
  node_id: ""
  heartbeat_interval: 10s
  node_ttl: 30s

# Метрики в Prometheus
metrics:
  # Включить HTTP-эндпоинт /metrics
  enabled: false
  port: 9091

# Логирование
log:
  level: "info"
