services:
  # --- Redis: Реестр нод и маршрутизатор комнат ---
  sfu-redis:
    image: redis:7.2-alpine
    container_name: sfu-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Kafka: Брокер очередей событий медиасервера (Apache Kafka KRaft) ---
  sfu-kafka:
    image: apache/kafka:3.7.0
    container_name: sfu-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://sfu-kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@sfu-kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- SFU Нода 1 (Node 1) ---
  sfu-node-1:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: sfu-node-1
    ports:
      - "8080:8080"        # Сигнальный HTTP/WebSocket
      - "3478:3478/udp"    # Встроенный TURN-сервер
      # Порты для WebRTC RTP/RTCP трафика
      - "50000-50015:50000-50015/udp"
    environment:
      - SERVER_HOST=sfu-node-1
      - SERVER_PORT=8080
      - CLUSTER_ENABLED=true
      - CLUSTER_REDIS_ADDR=sfu-redis:6379
      - CLUSTER_NODE_ID=node-1
      - CLUSTER_ENABLE_CASCADING=true
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=sfu-kafka:9092
      - KAFKA_TOPIC=sfu-events
      - METRICS_ENABLED=true
      - METRICS_PORT=9091  # Указываем отдельный порт для прохождения валидатора (фактически метрики отдаются на веб-порту /metrics)
      - TURN_ENABLED=true
      - TURN_PUBLIC_IP=127.0.0.1
      - TURN_PORT=3478
      - TURN_REALM=mephi-sfu
      - TURN_STATIC_SECRET=sfu-super-secret-key
      - TURN_MIN_PORT=50000
      - TURN_MAX_PORT=50015
    depends_on:
      sfu-redis:
        condition: service_healthy
      sfu-kafka:
        condition: service_healthy
    restart: unless-stopped

  # --- SFU Нода 2 (Node 2) ---
  sfu-node-2:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: sfu-node-2
    ports:
      - "8081:8080"        # Сигнальный HTTP/WebSocket (мапим хост 8081 -> контейнер 8080)
      - "3479:3478/udp"    # Встроенный TURN-сервер (мапим хост 3479 -> контейнер 3478)
      # Порты для WebRTC RTP/RTCP трафика (выделенный диапазон для исключения конфликтов)
      - "50016-50030:50016-50030/udp"
    environment:
      - SERVER_HOST=sfu-node-2
      - SERVER_PORT=8080
      - CLUSTER_ENABLED=true
      - CLUSTER_REDIS_ADDR=sfu-redis:6379
      - CLUSTER_NODE_ID=node-2
      - CLUSTER_ENABLE_CASCADING=true
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=sfu-kafka:9092
      - KAFKA_TOPIC=sfu-events
      - METRICS_ENABLED=true
      - METRICS_PORT=9092
      - TURN_ENABLED=true
      - TURN_PUBLIC_IP=127.0.0.1
      - TURN_PORT=3478
      - TURN_REALM=mephi-sfu
      - TURN_STATIC_SECRET=sfu-super-secret-key
      - TURN_MIN_PORT=50016
      - TURN_MAX_PORT=50030
    depends_on:
      sfu-redis:
        condition: service_healthy
      sfu-kafka:
        condition: service_healthy
    restart: unless-stopped

  # --- Prometheus: Сбор метрик и мониторинг ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sfu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # --- Grafana: Дашборд мониторинга ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sfu-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
